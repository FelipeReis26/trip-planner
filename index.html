<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tripsy</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --pink:#EA82A3; --mint:#74C7A6; --yellow:#F0C665; --sky:#7BB0DE; --ink:#241C14; --muted:#8C7C68; }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#F3ECD9; background-image:radial-gradient(circle, rgba(0,0,0,0.045) 1px, transparent 1px);
    background-size:7px 7px; color:var(--ink); font-family:'Space Grotesk',-apple-system,sans-serif; overflow-x:hidden;
  }
  a{ color:inherit; }
  .wrap{ max-width:560px; margin:0 auto; padding:40px 18px 80px; position:relative; }
  @media (min-width:480px){ .wrap{ padding:46px 22px 90px; } }
  @media (min-width:860px){ .wrap{ max-width:960px; padding:70px 40px 110px; } }
  @media (min-width:1300px){ .wrap{ max-width:1120px; } }

  .confetti{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .confetti svg{ position:absolute; }

  header{ position:relative; z-index:1; text-align:center; margin-bottom:8px; }
  h1{ font-size:34px; font-weight:700; margin:0; letter-spacing:-1px; }
  @media (min-width:480px){ h1{ font-size:38px; } }
  @media (min-width:860px){ h1{ font-size:48px; } }
  p.sub{ font-family:'Caveat',cursive; font-weight:700; font-size:19px; color:var(--muted); margin:2px 0 30px; }
  @media (min-width:480px){ p.sub{ font-size:20px; margin-bottom:34px; } }

  .totalnote{
    background:#fff; border:2px solid var(--ink); border-radius:18px; padding:18px 22px; max-width:300px;
    margin:0 auto 20px; text-align:center; position:relative; z-index:1;
  }
  .totalnote:last-of-type{ margin-bottom:40px; }
  @media (min-width:860px){ .totalnote{ max-width:340px; padding:22px 26px; } .totalnote:last-of-type{ margin-bottom:50px; } }
  .totalnote:nth-of-type(odd){ transform:rotate(-1.5deg); box-shadow:4px 4px 0 var(--pink); }
  .totalnote:nth-of-type(even){ transform:rotate(1.5deg); box-shadow:4px 4px 0 var(--sky); }
  .totalnote .tape{ position:absolute; top:-12px; left:50%; transform:translateX(-50%) rotate(-4deg); width:70px; height:22px;
    border:2px solid var(--ink); z-index:2; }
  .totalnote:nth-of-type(odd) .tape{ background:var(--mint); }
  .totalnote:nth-of-type(even) .tape{ background:var(--yellow); }
  .totalnote .yr{ font-family:'Caveat',cursive; font-weight:600; font-size:14px; color:var(--muted); }
  .totalnote .num{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px; }
  .totalnote .lbl{ font-family:'Caveat',cursive; font-weight:600; font-size:15px; color:var(--muted); }

  .section-label{ font-family:'Caveat',cursive; font-weight:700; font-size:21px; text-align:center; margin:8px 0 20px; position:relative; z-index:1; }
  @media (min-width:860px){ .section-label{ font-size:24px; margin:10px 0 22px; } }

  #upcoming, #past{ position:relative; z-index:1; }
  @media (min-width:860px){
    #upcoming, #past{ display:grid; grid-template-columns:repeat(2, 1fr); gap:16px 36px; align-items:stretch; }
    /* an odd one out (last child, odd position) spans both columns but stays card-width, centered */
    #upcoming .polaroid:last-child:nth-child(odd),
    #past .polaroid:last-child:nth-child(odd){ grid-column:1 / -1; justify-self:center; }
  }

  .polaroid{
    background:#fff; border:2px solid var(--ink); padding:14px 14px 16px; margin:0 auto 46px; max-width:280px;
    position:relative; z-index:1; text-decoration:none; color:var(--ink); display:flex; flex-direction:column;
  }
  @media (min-width:860px){ .polaroid{ margin:0 auto 14px; max-width:300px; } }
  .polaroid:nth-child(odd){ transform:rotate(-2.5deg); box-shadow:5px 5px 0 var(--sky); }
  .polaroid:nth-child(even){ transform:rotate(2.5deg); box-shadow:5px 5px 0 var(--yellow); }
  .polaroid .tapecorner{ position:absolute; top:-14px; width:60px; height:24px; border:2px solid var(--ink); z-index:2; }
  .polaroid:nth-child(odd) .tapecorner{ left:-14px; background:var(--pink); transform:rotate(-38deg); }
  .polaroid:nth-child(even) .tapecorner{ right:-14px; background:var(--mint); transform:rotate(38deg); }
  .polaroid .photo{ width:100%; aspect-ratio:1/1; flex:none; display:flex; align-items:center; justify-content:center; font-size:50px; border:2px solid var(--ink); }
  @media (min-width:480px){ .polaroid .photo{ font-size:54px; } }
  .polaroid.brazil .photo{ background:var(--mint); }
  .polaroid.bali .photo{ background:var(--yellow); }
  .polaroid.pink .photo{ background:var(--pink); }
  .polaroid.sky .photo{ background:var(--sky); }
  .polaroid .cap{ font-family:'Caveat',cursive; font-weight:700; text-align:center; font-size:24px; margin-top:12px; }
  @media (min-width:480px){ .polaroid .cap{ font-size:26px; } }
  .polaroid .meta{ text-align:center; font-size:11.5px; color:var(--muted); margin-top:2px; font-family:'Space Grotesk',sans-serif; }
  .polaroid.archived{ box-shadow:none !important; opacity:0.55; filter:grayscale(0.6); border-style:dashed; }

  .empty-note{ font-family:'Caveat',cursive; font-size:16px; color:var(--muted); text-align:center; margin-bottom:24px; position:relative; z-index:1; grid-column:1/-1; }

  .addtrip{
    display:block; text-align:center; font-family:'Caveat',cursive; font-weight:700; font-size:20px;
    color:var(--muted); text-decoration:none; border:2px dashed var(--muted); border-radius:14px;
    padding:16px; margin-top:6px; position:relative; z-index:1;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="confetti">
    <svg width="60" height="60" style="top:-6px; right:-16px;" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" style="fill:var(--sky);" opacity="0.9"/></svg>
    <svg width="46" height="46" style="top:210px; left:-18px;" viewBox="0 0 100 100"><polygon points="50,10 90,90 10,90" style="fill:var(--pink);" opacity="0.85"/></svg>
    <svg width="40" height="40" style="bottom:120px; right:-8px;" viewBox="0 0 100 100"><rect x="16" y="16" width="68" height="68" rx="8" style="fill:var(--yellow);" transform="rotate(15 50 50)" opacity="0.9"/></svg>
    <svg width="34" height="34" style="bottom:20px; left:6px;" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" style="fill:var(--mint);" opacity="0.85"/></svg>
  </div>

  <header>
    <h1>Tripsy</h1>
    <p class="sub">the trip scrapbook</p>
  </header>

  <div id="year-boxes"></div>

  <div class="section-label">Coming up</div>
  <div id="upcoming"></div>
  <div class="section-label">In the album</div>
  <div id="past"></div>

  <a href="add-trip.html" class="addtrip">+ Add a trip</a>
</div>
<script>
  function cardHtml(t, archived){
    return '<a class="polaroid ' + t.theme + (archived ? ' archived' : '') + '" href="trips/' + t.slug + '.html">' +
      '<div class="tapecorner"></div>' +
      '<div class="photo">' + t.flag + '</div><div class="cap">' + t.name + '</div><div class="meta">' + t.meta + '</div>' +
      '</a>';
  }

  fetch('trips.json')
    .then(function(r){ return r.json(); })
    .then(function(trips){
      var today = new Date(); today.setHours(0, 0, 0, 0);
      var upcomingEl = document.getElementById('upcoming'), pastEl = document.getElementById('past');
      var upcoming = [], past = [];
      trips.forEach(function(t){ (new Date(t.end) < today ? past : upcoming).push(t); });

      upcomingEl.innerHTML = upcoming.length
        ? upcoming.map(function(t){ return cardHtml(t, false); }).join('')
        : '<div class="empty-note">Nothing pinned up yet.</div>';

      pastEl.innerHTML = past.length
        ? past.map(function(t){ return cardHtml(t, true); }).join('')
        : '<div class="empty-note">Empty page, for now &mdash; trips move here on their own once the return date has passed.</div>';

      var byYear = {};
      upcoming.forEach(function(t){ (byYear[t.year] = byYear[t.year] || []).push(t.leave); });
      var boxesEl = document.getElementById('year-boxes');
      Object.keys(byYear).sort().forEach(function(year){
        var total = byYear[year].reduce(function(a, b){ return a + b; }, 0);
        var rest = 26 - total;
        var restLabel = rest >= 0 ? (rest + ' left') : (Math.abs(rest) + ' over');
        var box = document.createElement('div');
        box.className = 'totalnote';
        box.innerHTML =
          '<div class="tape"></div>' +
          '<div class="yr">' + year + '</div>' +
          '<div class="num">' + total + '/26</div>' +
          '<div class="lbl">leave days used &middot; ' + restLabel + '</div>';
        boxesEl.appendChild(box);
      });
    })
    .catch(function(){
      document.getElementById('upcoming').innerHTML = '<div class="empty-note">Couldn\'t load the trip list &mdash; try refreshing.</div>';
    });
</script>
</body>
</html>
