<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tripsy &middot; Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{ --pink:#EA82A3; --mint:#74C7A6; --yellow:#F0C665; --sky:#7BB0DE; --ink:#241C14; --muted:#8C7C68; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#F3ECD9; background-image:radial-gradient(circle, rgba(0,0,0,0.045) 1px, transparent 1px);
    background-size:7px 7px; color:var(--ink); font-family:'Space Grotesk',-apple-system,sans-serif; padding:22px;
  }
  .card{
    background:#fff; border:2px solid var(--ink); border-radius:16px; padding:32px 26px 26px;
    max-width:340px; width:100%; box-shadow:5px 5px 0 var(--pink); position:relative; text-align:center;
  }
  .tape{
    position:absolute; top:-13px; left:50%; transform:translateX(-50%) rotate(-3deg);
    width:74px; height:22px; background:var(--mint); border:2px solid var(--ink);
  }
  h1{ font-family:'Caveat',cursive; font-size:42px; font-weight:700; margin:4px 0 2px; }
  p.sub{ font-size:13px; color:var(--muted); margin:0 0 24px; }
  input{
    width:100%; font-family:'Space Grotesk',sans-serif; font-size:16px; padding:12px 14px;
    border:2px solid var(--ink); border-radius:8px; text-align:center; background:#fff; color:var(--ink);
  }
  input:focus{ outline:2px solid var(--sky); outline-offset:1px; }
  button{
    margin-top:14px; width:100%; background:var(--mint); border:2px solid var(--ink); color:var(--ink);
    font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; padding:13px 18px;
    border-radius:30px; cursor:pointer; box-shadow:4px 4px 0 var(--ink);
  }
  button:disabled{ opacity:0.6; cursor:default; }
  .err{
    margin-top:14px; font-size:12.5px; color:var(--ink); background:var(--pink);
    border:2px solid var(--ink); border-radius:8px; padding:8px 10px; display:none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="tape"></div>
    <h1>Tripsy</h1>
    <p class="sub">the trip scrapbook &mdash; password required</p>
    <form id="loginform">
      <input id="password" type="password" placeholder="Password" required autofocus autocomplete="current-password">
      <button type="submit">Log in</button>
    </form>
    <div class="err" id="err"></div>
  </div>
<script>
  document.getElementById('loginform').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = e.target.querySelector('button');
    var err = document.getElementById('err');
    btn.disabled = true; btn.textContent = 'Checking\u2026';
    err.style.display = 'none';
    try {
      var r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('password').value })
      });
      var data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Wrong password.');

      var params = new URLSearchParams(window.location.search);
      var redirect = params.get('redirect') || '/index.html';
      if (!redirect.startsWith('/') || redirect.startsWith('//')) redirect = '/index.html';
      window.location.href = redirect;
    } catch (ex) {
      err.textContent = ex.message;
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
